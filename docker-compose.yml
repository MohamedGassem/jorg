services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - gotenberg
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

volumes:
  uploads:
